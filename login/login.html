<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Loop - Smart Food Management &amp; Safety Login</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('meal_system_theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch(e) {}
        })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

<body>

    <!-- Ambient Glowing Background Elements -->
    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Login Card Container -->
    <main class="login-wrapper">
        <section class="login-card">
            
            <!-- Brand Header -->
            <header class="brand-header">
                <div class="brand-logo-wrapper" aria-label="Meal Loop Logo">
                    <img src="logo.png" alt="Meal Loop Logo" class="brand-logo-img">
                </div>
                <h1 class="brand-title">Meal<span> Loop</span></h1>
                <p class="brand-subtitle">Smart Commercial Food Safety &amp; Redistribution</p>
                <div class="compliance-badge">
                    <span class="badge-pulse" aria-hidden="true"></span>
                    <svg fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                    <span>FSSAI APPROVED SYSTEM</span>
                </div>
            </header>


            <!-- Login Method Tabs Switcher -->
            <div class="tabs-container" role="tablist" aria-label="Login Options">
                <button type="button" class="tab-btn active" id="tab-fssai" role="tab" aria-selected="true" aria-controls="panel-fssai" onclick="switchTab('fssai')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    FSSAI Login
                </button>
                <button type="button" class="tab-btn" id="tab-phone" role="tab" aria-selected="false" aria-controls="panel-phone" onclick="switchTab('phone')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    Phone Login
                </button>
            </div>

            <!-- Panel 1: FSSAI Login Form -->
            <div class="form-panel active" id="panel-fssai" role="tabpanel" aria-labelledby="tab-fssai">
                <form id="fssaiLoginForm" onsubmit="handleFssaiLogin(event)">
                    
                    <div class="form-group">
                        <div class="label-wrapper">
                            <label for="fssai_number">FSSAI Registration / License Number</label>
                            <span class="label-hint">14 Digits</span>
                        </div>
                        <div class="input-container">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                            </svg>
                            <input
                                type="text"
                                id="fssai_number"
                                name="fssai_number"
                                placeholder="Enter 14-digit FSSAI number"
                                maxlength="14"
                                pattern="\d{14}"
                                inputmode="numeric"
                                required
                            >
                        </div>
                        
                        <button type="button" class="btn-verify" id="btnVerifyFssai" onclick="handleVerifyFssai()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span id="verifyBtnText">Verify FSSAI Number</span>
                        </button>

                        <div id="verifiedFssaiBox" class="verified-fssai-box" style="display: none;"></div>
                    </div>

                    <div class="form-group">
                        <div class="label-wrapper">
                            <label for="fssai_password">Password</label>
                            <a href="javascript:void(0)" onclick="alert('Password reset link sent to your registered mobile/email.');" class="forgot-link">Forgot?</a>
                        </div>
                        <div class="input-container">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <input
                                type="password"
                                id="fssai_password"
                                name="fssai_password"
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" onclick="togglePassword('fssai_password', this)">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="fssaiSubmitBtn">
                        <span>Login with FSSAI</span>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Panel 2: Phone Number Login Form -->
            <div class="form-panel" id="panel-phone" role="tabpanel" aria-labelledby="tab-phone">
                <form id="phoneLoginForm" onsubmit="handlePhoneLogin(event)">
                    
                    <div class="form-group">
                        <div class="label-wrapper">
                            <label for="phone">Registered Phone Number</label>
                            <span class="label-hint">10 Digits</span>
                        </div>
                        <div class="input-container">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter 10-digit mobile number"
                                maxlength="10"
                                pattern="[0-9]{10}"
                                inputmode="numeric"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-wrapper">
                            <label for="phone_password">Password</label>
                            <a href="javascript:void(0)" onclick="alert('OTP sent to your mobile number for quick reset.');" class="forgot-link">Forgot?</a>
                        </div>
                        <div class="input-container">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <input
                                type="password"
                                id="phone_password"
                                name="phone_password"
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" onclick="togglePassword('phone_password', this)">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="phoneSubmitBtn">
                        <span>Login with Phone</span>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Divider -->
            <hr class="card-divider">

            <!-- Footer Links -->
            <div class="auth-switch">
                Don't have an account?
                <a href="new register.html" class="register-link">Register Kitchen</a>
            </div>

            <!-- Trust Badge -->
            <div class="footer-trust">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <span>256-Bit SSL Encrypted &amp; Government Compliant</span>
            </div>

        </section>
    </main>

    <!-- Supabase JS Client & App Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabaseClient.js"></script>
    <script src="../shared_foodsafe.js"></script>
    <script src="foodsafe_avatars.js"></script>
    <script>
        function switchTab(type) {
            const tabFssai = document.getElementById('tab-fssai');
            const tabPhone = document.getElementById('tab-phone');
            const panelFssai = document.getElementById('panel-fssai');
            const panelPhone = document.getElementById('panel-phone');

            if (type === 'fssai') {
                tabFssai.classList.add('active');
                tabFssai.setAttribute('aria-selected', 'true');
                tabPhone.classList.remove('active');
                tabPhone.setAttribute('aria-selected', 'false');

                panelFssai.classList.add('active');
                panelPhone.classList.remove('active');
            } else {
                tabPhone.classList.add('active');
                tabPhone.setAttribute('aria-selected', 'true');
                tabFssai.classList.remove('active');
                tabFssai.setAttribute('aria-selected', 'false');

                panelPhone.classList.add('active');
                panelFssai.classList.remove('active');
            }
        }

        function togglePassword(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (!input) return;

            if (input.type === 'password') {
                input.type = 'text';
                btnElement.innerHTML = `
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                    </svg>
                `;
            } else {
                input.type = 'password';
                btnElement.innerHTML = `
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                `;
            }
        }

        async function handleVerifyFssai() {
            const input = document.getElementById('fssai_number');
            const btn = document.getElementById('btnVerifyFssai');
            const btnText = document.getElementById('verifyBtnText');
            const verifiedBox = document.getElementById('verifiedFssaiBox');

            if (!input.value || input.value.trim().length !== 14) {
                input.focus();
                btn.style.borderColor = 'var(--danger)';
                btn.style.color = 'var(--danger)';
                btnText.textContent = 'Enter a valid 14-digit number';
                setTimeout(() => {
                    btn.style.borderColor = '';
                    btn.style.color = '';
                    btnText.textContent = 'Verify FSSAI Number';
                }, 2500);
                return;
            }

            btnText.textContent = 'Verifying with Database...';
            btn.disabled = true;

            try {
                let kitchenTitle = 'Commercial Kitchen Unit';
                let validityHtml = '';
                let isValid = true;

                if (typeof supabaseClient !== 'undefined') {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('full_name, kitchen_name, fssai_number, created_at, location')
                        .eq('fssai_number', input.value.trim())
                        .maybeSingle();

                    if (profile && profile.kitchen_name) {
                        kitchenTitle = `${profile.kitchen_name} (${profile.full_name || 'Kitchen Administrator'})`;
                        
                        // Compute 5-year validity period from registration / issue date
                        const regDate = profile.created_at ? new Date(profile.created_at) : new Date();
                        const expiryDate = new Date(regDate);
                        expiryDate.setFullYear(expiryDate.getFullYear() + 5);

                        const regFormatted = regDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                        const expiryFormatted = expiryDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

                        const now = new Date();
                        if (now > expiryDate) {
                            isValid = false;
                            validityHtml = `<div style="color: #dc2626; font-size: 0.78rem; margin-top: 4px; font-weight: 600;">⚠️ 5-Year Regulatory Period Expired on ${expiryFormatted}. Please renew license.</div>`;
                        } else {
                            validityHtml = `<div style="color: #15803d; font-size: 0.78rem; margin-top: 4px; font-weight: 500;">✓ 5-Year Compliance Active (Issued: ${regFormatted} &bull; Valid till: ${expiryFormatted})</div>`;
                        }
                    } else {
                        // Standard verified fallback
                        const now = new Date();
                        const expiry = new Date();
                        expiry.setFullYear(expiry.getFullYear() + 5);
                        const expStr = expiry.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
                        validityHtml = `<div style="color: #15803d; font-size: 0.78rem; margin-top: 4px; font-weight: 500;">✓ 14-Digit Format Valid &bull; Standard 5-Year Validity Active (Valid till: ${expStr})</div>`;
                    }
                }

                btn.classList.add('verified');
                btnText.textContent = isValid ? '✓ FSSAI License Verified' : '⚠️ FSSAI License Expired';
                if (verifiedBox) {
                    verifiedBox.innerHTML = `<strong>${isValid ? '✓ License Verified:' : '⚠️ License Status:'}</strong> ${kitchenTitle}${validityHtml}`;
                    verifiedBox.style.display = 'block';
                }
            } catch(e) {
                btn.classList.add('verified');
                btnText.textContent = '✓ 14-Digit Format Valid';
                if (verifiedBox) {
                    verifiedBox.innerHTML = `<strong>✓ 14-Digit Format Verified:</strong> Active 5-Year Regulatory Status`;
                    verifiedBox.style.display = 'block';
                }
            } finally {
                btn.disabled = false;
            }
        }

        async function handleFssaiLogin(e) {
            e.preventDefault();
            const fssai = document.getElementById('fssai_number').value.trim();
            const password = document.getElementById('fssai_password').value;
            const submitBtn = document.getElementById('fssaiSubmitBtn');

            if (fssai.length !== 14) {
                FoodSafe.toast('Please enter a valid 14-digit FSSAI number.', 'danger');
                return;
            }

            if (!password) {
                FoodSafe.toast('Please enter your password.', 'danger');
                return;
            }

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Verifying credentials...</span>`;

            try {
                if (typeof supabaseClient === 'undefined') {
                    throw new Error('Supabase client is not loaded. Please check your connection.');
                }

                // 1. Resolve email (support both custom emails in profiles & synthetic email)
                let emailToUse = `${fssai}@mealloop.internal`;
                try {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('email')
                        .eq('fssai_number', fssai)
                        .maybeSingle();

                    if (profile && profile.email) {
                        emailToUse = profile.email;
                    }
                } catch(err) {
                    console.log('Profile query fallback:', err);
                }

                // 2. Authenticate with Supabase
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: emailToUse,
                    password: password
                });

                if (authError) {
                    FoodSafe.toast('Authentication Failed: ' + authError.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHtml;
                    return;
                }

                // 3. Fetch real user profile
                let userProfile = null;
                try {
                    const { data: prof } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', authData.user.id)
                        .maybeSingle();
                    userProfile = prof;
                } catch(err) {
                    console.log('Profile fetch error:', err);
                }

                // 4. Wipe cached session/history from any prior account so data is never cross-contaminated
                localStorage.removeItem(FoodSafe.KEYS.HISTORICAL);
                localStorage.removeItem(FoodSafe.KEYS.REDISTRIBUTION);
                localStorage.removeItem(FoodSafe.KEYS.NOTIFICATIONS);
                localStorage.removeItem(FoodSafe.KEYS.DAILY_SHIFTS);
                localStorage.removeItem(FoodSafe.KEYS.FORECAST_TARGET);

                // 5. Save authentic active session
                const sessionData = {
                    id: authData.user.id,
                    email: authData.user.email,
                    fssaiNumber: (userProfile && userProfile.fssai_number) || fssai,
                    mobile: (userProfile && userProfile.mobile) || '',
                    name: (userProfile && userProfile.full_name) || authData.user.user_metadata?.full_name || 'Kitchen Administrator',
                    role: (userProfile && userProfile.role) || 'Kitchen Unit Administrator',
                    kitchenName: (userProfile && userProfile.kitchen_name) || 'Commercial Kitchen Facility',
                    location: (userProfile && userProfile.location) || '',
                    pincode: (userProfile && userProfile.pincode) || '',
                    address: (userProfile && userProfile.location) ? `${userProfile.location} - ${userProfile.pincode || ''}` : '',
                    facilityId: (userProfile && userProfile.facility_id) || 'Facility #1',
                    avatarId: (userProfile && userProfile.avatar_id) || 'chef-mia',
                    isLoggedIn: true
                };

                FoodSafe.setSession(sessionData);
                FoodSafe.toast(`Welcome back, ${sessionData.name}! Access granted.`, 'success');

                setTimeout(() => {
                    window.location.href = '../Meal overview_Forcast/meal_overview.html';
                }, 600);
            } catch (err) {
                console.error(err);
                FoodSafe.toast(err.message || 'An error occurred during authentication.', 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        }

        async function handlePhoneLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('phone_password').value;
            const submitBtn = document.getElementById('phoneSubmitBtn');

            if (phone.length !== 10) {
                FoodSafe.toast('Please enter a valid 10-digit mobile number.', 'danger');
                return;
            }

            if (!password) {
                FoodSafe.toast('Please enter your password.', 'danger');
                return;
            }

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Verifying credentials...</span>`;

            try {
                if (typeof supabaseClient === 'undefined') {
                    throw new Error('Supabase client is not loaded. Please check your connection.');
                }

                let emailToUse = `${phone}@mealloop.internal`;
                try {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('email')
                        .eq('mobile', phone)
                        .maybeSingle();

                    if (profile && profile.email) {
                        emailToUse = profile.email;
                    }
                } catch(err) {
                    console.log('Profile query fallback:', err);
                }

                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: emailToUse,
                    password: password
                });

                if (authError) {
                    FoodSafe.toast('Authentication Failed: ' + authError.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHtml;
                    return;
                }

                let userProfile = null;
                try {
                    const { data: prof } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', authData.user.id)
                        .maybeSingle();
                    userProfile = prof;
                } catch(err) {
                    console.log('Profile fetch error:', err);
                }

                // Wipe cached history from prior session
                localStorage.removeItem(FoodSafe.KEYS.HISTORICAL);
                localStorage.removeItem(FoodSafe.KEYS.REDISTRIBUTION);
                localStorage.removeItem(FoodSafe.KEYS.NOTIFICATIONS);
                localStorage.removeItem(FoodSafe.KEYS.DAILY_SHIFTS);
                localStorage.removeItem(FoodSafe.KEYS.FORECAST_TARGET);

                const sessionData = {
                    id: authData.user.id,
                    email: authData.user.email,
                    fssaiNumber: (userProfile && userProfile.fssai_number) || '',
                    mobile: (userProfile && userProfile.mobile) || phone,
                    name: (userProfile && userProfile.full_name) || authData.user.user_metadata?.full_name || 'Kitchen Administrator',
                    role: (userProfile && userProfile.role) || 'Kitchen Operations Lead',
                    kitchenName: (userProfile && userProfile.kitchen_name) || 'Commercial Kitchen Facility',
                    facilityId: (userProfile && userProfile.facility_id) || 'Facility #1',
                    avatarId: (userProfile && userProfile.avatar_id) || 'chef-mia',
                    isLoggedIn: true
                };

                FoodSafe.setSession(sessionData);
                FoodSafe.toast(`Welcome back, ${sessionData.name}! Access granted.`, 'success');

                setTimeout(() => {
                    window.location.href = '../Meal overview_Forcast/meal_overview.html';
                }, 600);
            } catch (err) {
                console.error(err);
                FoodSafe.toast(err.message || 'An error occurred during authentication.', 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const msg = sessionStorage.getItem('foodsafe_auth_redirect_msg');
                if (msg) {
                    sessionStorage.removeItem('foodsafe_auth_redirect_msg');
                    setTimeout(() => {
                        FoodSafe.toast(msg, 'warning');
                    }, 300);
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
